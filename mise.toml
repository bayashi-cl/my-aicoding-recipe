[tools]
uv = "latest"
pnpm = "latest"
# Node は mise の npm バックエンドが必要とするため、また claude-code (Node アプリ) の実行に必要なため導入。
# プロジェクトの Node ランタイム（apps/web）は pnpm の devEngines.runtime で別管理する方針は維持する。
node = "lts"
"npm:@anthropic-ai/claude-code" = "latest"
# GitHub CLI: AI/人間ともに Issue・PR を読み書きするのに必須。
# 認証 (`gh auth login`) は人間が実施する。AI 側でトークンは扱わない。
"github:cli/cli" = { version = "latest", exe = "gh" }
# pgcli: PostgreSQL CLI クライアント（補完・シンタックスハイライト付き）。psql の代替。
"pipx:pgcli" = { version = "latest", uvx_args = "--with psycopg-binary" }

[tasks."lint:py"]
description = "ruff check + format check"
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks."typecheck:py"]
description = "ty type check"
run = "uv run ty check"

[tasks."lint:ts"]
description = "biome ci (lint + format on TS/TSX/JSON)"
run = "pnpm exec biome ci ."

[tasks."typecheck:ts"]
description = "tsc --noEmit for mar-web"
run = "pnpm --filter mar-web exec tsc --noEmit"

[tasks.check]
description = "全体チェック (CI と同じセット)"
depends = ["lint:py", "typecheck:py", "lint:ts", "typecheck:ts"]

[tasks."claude:dangerous"]
description = "危険: Claude にコードの変更を任せるタスク。内容をよく確認してから実行すること。"
run = "claude --allow-dangerously-skip-permissions"
env = { IS_SANDBOX = "1" }
alias = "ccd"
