[tool.uv.workspace]
members = ["python/*"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
root = ["./python"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.15.13",
    "ty>=0.0.37",
]

[tool.alembic]
script_location = "mar_migrate:"

[[tool.alembic.post_write_hooks]]
name = "ruff-check"
type = "exec"
executable = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff-format"
type = "exec"
executable = "ruff"
options = "format REVISION_SCRIPT_FILENAME"
