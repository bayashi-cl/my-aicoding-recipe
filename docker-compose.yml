services:
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - .:/workspaces/my-aicoding-recipe:cached
      - node_modules:/workspaces/my-aicoding-recipe/node_modules
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/notes
      VITE_API_URL: http://localhost:8000
    env_file:
      - path: .devcontainer/.env
        required: false
    depends_on: [db]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: notes
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d notes"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  node_modules:
  mise-data:
